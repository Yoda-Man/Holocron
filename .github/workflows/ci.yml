# CI — Continuous Integration

# Runs on every push to any branch. Validates the plugin builds and all
# tests pass before allowing merge to main.
#
# @see 09-Deployment-Spec.md §8.1 — CI/CD pipeline

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emscripten-cache
        with:
          path: ~/.emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten
        if: steps.emscripten-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/.emsdk
          cd ~/.emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Activate Emscripten
        run: |
          cd ~/.emsdk
          source ./emsdk_env.sh
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Build WASM module
        run: |
          source ~/.emsdk/emsdk_env.sh
          npm run build:wasm

      - name: Run unit tests
        run: npm run test:unit

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Build plugin bundle (Vite)
        run: npm run build

      - name: Run privacy network scan
        run: |
          echo "=== Static network scan ==="
          grep -rn "fetch(" frontend/ backend/ main.js --include="*.js" --include="*.jsx" 2>/dev/null || true
          echo "---"
          echo "Checking for external URLs..."
          grep -rnoP "fetch\(['\"](?!\/api\/)(?!http://localhost)(?!file://)([^'\"]+)" frontend/ backend/ main.js 2>/dev/null && echo "FAIL: External URL detected" || echo "PASS: All fetch URLs are localhost or /api/"

      - name: Verify plugin.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8')); console.log('plugin.json: valid')"

      - name: Verify dist output
        run: |
          test -f dist/plugin.json || { echo "Missing dist/plugin.json"; exit 1; }
          test -f dist/main.js || { echo "Missing dist/main.js"; exit 1; }
          echo "dist/ contents:"
          find dist -type f | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: |
            dist/
            frontend/layout_engine.mjs
            frontend/layout_engine.wasm

  benchmark:
    name: Performance Benchmarks
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run layout benchmarks
        run: npm run bench:layout:json

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
